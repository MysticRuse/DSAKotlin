kotlin.code.style=official

# JDK 24+ restricts native library loading; Gradle’s native helpers need this or the daemon can fail.
# See warnings: "Restricted methods will be blocked... unless native access is enabled"
org.gradle.jvmargs=-Xmx512m -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED

# If the build fails with: IllegalArgumentException: 25.0.1 (or similar) while compiling
# build.gradle.kts, Gradle’s Kotlin DSL does not support running on JDK 25 yet. Point Gradle
# at JDK 21 or 23 (matches kotlin { jvmToolchain(23) } in build.gradle.kts):
#
# macOS (Terminal):
#   export JAVA_HOME=$(/usr/libexec/java_home -v 23)
# Or uncomment and set an absolute path:
# org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-23.jdk/Contents/Home
